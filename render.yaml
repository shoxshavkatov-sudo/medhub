services:
  - type: web
    name: medhub
    runtime: static
    buildCommand: mkdir -p dist && cp -R index.html js css img vendor models dist/
    staticPublishPath: dist
    headers:
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /js/*
        name: Cache-Control
        value: public, max-age=600
      - path: /css/*
        name: Cache-Control
        value: public, max-age=600
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
