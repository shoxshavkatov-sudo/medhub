services:
  - type: web
    name: medhub
    runtime: static
    buildCommand: bash build.sh
    staticPublishPath: dist
    headers:
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /js/*
        name: Cache-Control
        value: public, max-age=600
      - path: /css/*
        name: Cache-Control
        value: public, max-age=600
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
