<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedHub — платформа для студентов-медиков</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6fed' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M5.5 3v5a4.5 4.5 0 0 0 9 0V3'/%3E%3Cpath d='M10 12v3a5.5 5.5 0 0 0 11 0v-2.2'/%3E%3Ccircle cx='21' cy='10.5' r='1.9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="main-col">
    <header id="topbar">
      <div class="brand-top">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M5.5 3v5a4.5 4.5 0 0 0 9 0V3"/><path d="M3.5 3h2M14.5 3h2"/><path d="M10 12v3a5.5 5.5 0 0 0 11 0v-2.2"/><circle cx="21" cy="10.5" r="1.9"/></svg></span>
        <b>MedHub</b>
      </div>
      <div class="search-wrap">
        <input id="global-search" type="search" autocomplete="off" placeholder="">
        <button id="search-go" class="btn small"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:17px;height:17px"><circle cx="11" cy="11" r="6.2"/><path d="m15.8 15.8 5 5"/></svg></button>
      </div>
      <div class="top-actions">
        <button id="ai-btn" class="icon-btn" title="ИИ-ассистент" aria-label="ИИ-ассистент"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><rect x="4.5" y="8" width="15" height="11.5" rx="3.5"/><path d="M12 8V4.5M9 4.5h6"/><circle cx="9.3" cy="13.2" r="1.2"/><circle cx="14.7" cy="13.2" r="1.2"/><path d="M9.5 16.8h5"/></svg></button>
        <select id="lang-select" aria-label="Язык">
          <option value="ru">RU</option><option value="uz">UZ</option><option value="en">EN</option>
        </select>
        <button id="theme-btn" class="icon-btn" title="Тема"></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer class="muted small-print"></footer>
  </div>
</div>

<div id="ai-panel" class="hidden">
  <div class="ai-p-head">
    <div class="ai-bot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="8" width="15" height="11.5" rx="3.5"/><path d="M12 8V4.5M9 4.5h6"/><circle cx="9.3" cy="13.2" r="1.2"/><circle cx="14.7" cy="13.2" r="1.2"/><path d="M9.5 16.8h5"/></svg></div>
    <div style="flex:1;min-width:0"><b>ИИ-ассистент</b><div class="muted" id="ai-sub" style="font-size:.75rem"></div></div>
    <button id="ai-close" class="icon-btn" aria-label="Закрыть">✕</button>
  </div>
  <div id="ai-log" class="ai-log"></div>
  <div class="chiprow" id="ai-sug"></div>
  <div class="ai-p-input">
    <input type="text" id="ai-q" autocomplete="off">
    <button class="btn" id="ai-send" aria-label="Отправить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M21 3.5 3.5 10.8l6.8 2.4L12.7 20 21 3.5Z"/><path d="m10.3 13.2 4.2-4.2"/></svg></button>
  </div>
  <div id="ai-keyline" class="hidden">
    <input type="password" id="ai-keyin" placeholder="gsk_…" autocomplete="off">
    <button class="btn small" id="ai-keysave">OK</button>
  </div>
  <p class="muted" id="ai-foot" style="font-size:.72rem;margin:6px 0 0"></p>
</div>
<nav id="dock" aria-label="Разделы"></nav>
<div id="dock-sheet" class="hidden"></div>
<div id="toast" class="hidden"></div>
<canvas id="print-canvas" class="hidden"></canvas>

<script src="js/i18n.js?v=20260911b"></script>
<script src="js/data.js?v=20260911b"></script>
<script src="js/data2.js?v=20260911b"></script>
<script src="vendor/three.min.js?v=20260911b"></script>
<script src="vendor/OrbitControls.js?v=20260911b"></script>
<script src="vendor/DRACOLoader.js?v=20260911b"></script>
<script src="vendor/GLTFLoader.js?v=20260911b"></script>
<script src="vendor/SkeletonUtils.js?v=20260911b"></script>
<script src="js/body3d.js?v=20260911b"></script>
<script src="js/sims.js?v=20260911d"></script>
<script src="js/ai_config.js?v=20260911b"></script>
<script src="js/app.js?v=20260911b"></script>
</body>
</html>
