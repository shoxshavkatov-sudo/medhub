<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedHub — платформа для студентов-медиков</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="main-col">
    <header id="topbar">
      <div class="brand-top">
        <span class="logo">🩺</span>
        <b>MedHub</b>
      </div>
      <div class="search-wrap">
        <input id="global-search" type="search" autocomplete="off" placeholder="">
        <button id="search-go" class="btn small">🔍</button>
      </div>
      <div class="top-actions">
        <select id="lang-select" aria-label="Язык">
          <option value="ru">RU</option><option value="uz">UZ</option><option value="en">EN</option>
        </select>
        <button id="theme-btn" class="icon-btn" title="Тема">🌙</button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer class="muted small-print"></footer>
  </div>
</div>
<nav id="dock" aria-label="Разделы"></nav>
<div id="dock-sheet" class="hidden"></div>
<div id="toast" class="hidden"></div>
<canvas id="print-canvas" class="hidden"></canvas>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/data2.js"></script>
<script src="js/sims.js"></script>
<script src="js/app.js"></script>
</body>
</html>
